[project]
name = "ddicdi-gen2"
version = "0.1.0"
description = "DDI-CDI generator backend, gen2: qsv readstat based import, FastAPI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Benjamin Beuster", email = "benjamin.beuster@sikt.no" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pyshacl>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddicdi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (remote DDI-CDI JSON-LD context)"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:.*httpx2.*",
    "ignore:Dataset.default_context is deprecated.*",  # rdflib internals, via pyshacl
]
